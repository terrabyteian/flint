{{define "content"}}
<section class="narrow card">
  <h1>Sign in</h1>
  {{- if .Data.Message}}
  <p class="alert error" role="alert">{{.Data.Message}}</p>
  {{- end}}
  <form method="post" action="/ui/login" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label for="username">User name</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required value="{{.Data.User}}"{{if not .Data.User}} autofocus{{end}}>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required{{if .Data.User}} autofocus{{end}}>
    <button type="submit" class="primary">Sign in</button>
  </form>
  {{- if .Providers}}
  <div class="providers">
    <p class="or">or</p>
    {{- range .Providers}}
    <a class="button" href="{{.URL}}">Sign in with {{.Name}}</a>
    {{- end}}
  </div>
  {{- end}}
</section>
{{end}}
