# Default values for the flint chart. docs/helm.md describes installation.

image:
  repository: ghcr.io/terrabyteian/flint
  # tag defaults to the chart's appVersion, which is the release version.
  tag: ""
  # digest, such as sha256:..., pins the image and takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# flint's configuration file, written as YAML and rendered to the JSON file
# flint serve reads. The fields are those of docs/configuration.md, except
# listen, dataDir, and tls, which the chart sets from containerPort, the data
# volume, and the tls values below, and backup.directory, which the backup
# values below set. flint rejects unknown fields and invalid
# values at startup; check a rendered configuration with flint config check.
config:
  log:
    level: info
  # Keep shutdownTimeout plus lifecycle.preStopSleepSeconds below
  # terminationGracePeriodSeconds, so a shutdown finishes before the kubelet
  # kills the container.
  shutdownTimeout: 25s
  # Proxies, as IP addresses or CIDR prefixes, whose X-Forwarded-* headers
  # flint believes, such as an ingress controller's pod network.
  trustedProxies: []
  repositories: []
  # - name: docker-local
  #   format: oci
  #   type: hosted
  #   # Also serve the Helm charts pushed here as a classic Helm chart
  #   # repository at /helm/docker-local/.
  #   helmIndex: true
  # - name: dockerhub
  #   format: oci
  #   type: proxy
  #   anonymousPull: true
  #   proxy:
  #     url: https://registry-1.docker.io
  #     # Optional upstream credentials; the password comes from
  #     # upstreamSecrets below.
  #     username: my-docker-hub-user
  #     passwordFile: /etc/flint/upstream/dockerhub/password
  auth:
    permissions: []
  # proxyCache:
  #   # Free space below which proxy repositories stop caching new content.
  #   minFreeSpace: 5%
  # The audit log of every change (docs/operations.md) is kept forever by
  # default, on the data volume; retention bounds it by age, size, or both.
  # audit:
  #   retention:
  #     maxAge: 8760h
  #     maxSize: 10GiB

# Secrets holding proxy repositories' upstream passwords or access tokens.
# Each Secret's key "password" is mounted at
# /etc/flint/upstream/<name>/password, the path to give as
# config.repositories[].proxy.passwordFile. flint reads the file whenever it
# authenticates, so a rotated Secret takes effect without a restart.
upstreamSecrets: []
# - name: dockerhub
#   # Such as one made with
#   #   kubectl create secret generic dockerhub-credentials --from-literal=password=...
#   existingSecret: dockerhub-credentials

# The first administrator, which flint creates at startup while no
# administrator exists (docs/auth.md). Its password is the key "password" of
# an existing Secret, mounted at /etc/flint/admin; flint reads it only while no
# administrator exists, so the Secret may be deleted afterwards. Without
# it, flint starts with no administrator and logs a warning.
bootstrapAdmin:
  enabled: false
  username: admin
  # The Secret holding the password, such as one made with
  #   kubectl create secret generic flint-admin --from-literal=password=...
  existingSecret: ""

# A volume for backups (docs/backup.md), mounted at /var/backups/flint, which
# the chart sets as config.backup.directory. Start backups through the admin
# API, for example from a CronJob that runs flint backup.
backup:
  enabled: false
  # An existing PersistentVolumeClaim to back up to, ideally on other
  # storage than the data volume.
  existingClaim: ""
  # Or any other volume source, used when existingClaim is empty, such as
  #   nfs:
  #     server: nas.example.internal
  #     path: /backups/flint
  volume: {}

# The port flint listens on in the container.
containerPort: 5000

service:
  # ClusterIP, NodePort, or LoadBalancer.
  type: ClusterIP
  port: 5000
  # nodePort for type NodePort or LoadBalancer; empty lets Kubernetes choose.
  nodePort: null
  # loadBalancerIP requests a fixed address from load balancers that honor it.
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  # externalTrafficPolicy for NodePort and LoadBalancer: Cluster or Local.
  # Local keeps the client address, which flint logs.
  externalTrafficPolicy: ""
  annotations: {}
  labels: {}

tls:
  # Serve HTTPS from a certificate in a kubernetes.io/tls secret, mounted at
  # /etc/flint/tls. flint reloads it when the secret changes. Without TLS,
  # flint serves plain HTTP, for example behind a TLS-terminating proxy.
  enabled: false
  # An existing kubernetes.io/tls secret. Leave empty to have cert-manager
  # issue one with certManager below.
  existingSecret: ""
  certManager:
    # Create a cert-manager Certificate whose secret flint serves.
    enabled: false
    issuerRef:
      name: ""
      # ClusterIssuer or Issuer.
      kind: ClusterIssuer
      group: cert-manager.io
    # Names in the certificate. The service's cluster DNS names are added.
    dnsNames: []
    ipAddresses: []
    # duration and renewBefore, as Go durations; empty uses the issuer's.
    duration: ""
    renewBefore: ""
    privateKey:
      algorithm: ECDSA
      size: 256
      rotationPolicy: Always
    # secretName defaults to <fullname>-tls.
    secretName: ""

persistence:
  # Keep the data directory on a PersistentVolumeClaim. Disabled, the data
  # directory is an emptyDir and is lost with the pod.
  enabled: true
  # Use an existing claim instead of the StatefulSet's claim template.
  existingClaim: ""
  # storageClass for the claim; empty uses the cluster default, and "-"
  # requests no storage class.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

lifecycle:
  # Seconds the container waits before flint begins shutting down, so the
  # pod leaves Service endpoints before flint stops accepting connections.
  # 0 disables the wait.
  preStopSleepSeconds: 5

terminationGracePeriodSeconds: 40

probes:
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  # startup allows failureThreshold * periodSeconds for flint to replay its
  # metadata log before the liveness probe starts.
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 150

serviceAccount:
  create: true
  # name defaults to the fullname when create is true, and to "default" when
  # it is false.
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  # Create a NetworkPolicy that admits traffic only to flint's port.
  enabled: false
  # Peers allowed to reach flint, as NetworkPolicy "from" entries. Empty
  # admits every source.
  from: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: monitoring

resources: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   memory: 512Mi

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
