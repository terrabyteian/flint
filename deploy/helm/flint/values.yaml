# Default values for the flint chart. docs/helm.md describes installation.

image:
  repository: ghcr.io/terrabyteian/flint
  # tag defaults to the chart's appVersion, which is the release version.
  tag: ""
  # digest, such as sha256:..., pins the image and takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# flint's configuration file, written as YAML and rendered to the JSON file
# flint serve reads. The fields are those of docs/configuration.md, except
# listen, dataDir, and tls, which the chart sets from containerPort, the data
# volume, and the tls values below, and backup.directory, which the backup
# values below set. flint rejects unknown fields and invalid
# values at startup; check a rendered configuration with flint config check.
config:
  log:
    level: info
  # Keep shutdownTimeout plus lifecycle.preStopSleepSeconds below
  # terminationGracePeriodSeconds, so a shutdown finishes before the kubelet
  # kills the container.
  shutdownTimeout: 25s
  # Proxies, as IP addresses or CIDR prefixes, whose X-Forwarded-* headers
  # flint believes, such as an ingress controller's pod network.
  trustedProxies: []
  repositories: []
  # - name: docker-local
  #   format: oci
  #   type: hosted
  #   # Also serve the Helm charts pushed here as a classic Helm chart
  #   # repository at /helm/docker-local/.
  #   helmIndex: true
  # - name: dockerhub
  #   format: oci
  #   type: proxy
  #   anonymousPull: true
  #   proxy:
  #     url: https://registry-1.docker.io
  #     # Optional upstream credentials; the password comes from
  #     # upstreamSecrets below.
  #     username: my-docker-hub-user
  #     passwordFile: /etc/flint/upstream/dockerhub/password
  # # One path for both: pulls come from whichever has the image, and
  # # pushes go to docker-local (docs/configuration.md).
  # - name: docker
  #   format: oci
  #   type: virtual
  #   virtual:
  #     members: [docker-local, dockerhub]
  #     publishTo: docker-local
  # # PyPI: a hosted repository, a pypi.org proxy, and a virtual repository
  # # merging them behind one index URL (docs/pypi.md).
  # - name: pypi-local
  #   format: pypi
  #   type: hosted
  # - name: pypi
  #   format: pypi
  #   type: proxy
  #   proxy:
  #     url: https://pypi.org/simple/
  # - name: pypi-all
  #   format: pypi
  #   type: virtual
  #   virtual:
  #     members: [pypi-local, pypi]
  # # Generic files: a hosted repository for curl and wget, and a proxy of
  # # a project's release downloads, cached forever (docs/generic.md).
  # - name: files
  #   format: generic
  #   type: hosted
  # - name: tool-releases
  #   format: generic
  #   type: proxy
  #   generic:
  #     immutable: true
  #   proxy:
  #     url: https://github.com/acme/tool/releases/download/
  #     # GitHub redirects release downloads to these hosts.
  #     allowHosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
  # # Cargo: a hosted repository, a crates.io proxy, and a virtual registry
  # # merging them, which cargo publish can publish to (docs/cargo.md).
  # - name: cargo-local
  #   format: cargo
  #   type: hosted
  # - name: crates-io
  #   format: cargo
  #   type: proxy
  #   proxy:
  #     url: sparse+https://index.crates.io/
  # - name: cargo-all
  #   format: cargo
  #   type: virtual
  #   virtual:
  #     members: [cargo-local, crates-io]
  #     publishTo: cargo-local
  # # npm: a hosted repository, a registry.npmjs.org proxy, and a virtual
  # # registry merging them, which npm publish can publish to; the proxy
  # # member never serves the internal @acme scope (docs/npm.md).
  # - name: npm-local
  #   format: npm
  #   type: hosted
  # - name: npmjs
  #   format: npm
  #   type: proxy
  #   proxy:
  #     url: https://registry.npmjs.org/
  # - name: npm
  #   format: npm
  #   type: virtual
  #   virtual:
  #     members: [npm-local, {name: npmjs, exclude: ["@acme/*"]}]
  #     publishTo: npm-local
  # # Maven: hosted release and snapshot repositories, a Maven Central proxy,
  # # and a virtual repository merging them behind one URL (docs/maven.md).
  # - name: maven-releases
  #   format: maven
  #   type: hosted
  # - name: maven-snapshots
  #   format: maven
  #   type: hosted
  #   maven:
  #     versionPolicy: snapshot
  # - name: maven-central
  #   format: maven
  #   type: proxy
  #   proxy:
  #     url: https://repo.maven.apache.org/maven2
  # - name: maven-all
  #   format: maven
  #   type: virtual
  #   virtual:
  #     members: [maven-releases, maven-snapshots, maven-central]
  # # Go modules: a proxy.golang.org proxy, which also proxies the Go
  # # checksum database, behind a virtual repository; the go command needs
  # # TLS to send credentials (docs/go.md).
  # - name: goproxy
  #   format: go
  #   type: proxy
  #   proxy:
  #     url: https://proxy.golang.org
  # - name: go-all
  #   format: go
  #   type: virtual
  #   virtual:
  #     members: [goproxy]
  auth:
    permissions: []
  # proxyCache:
  #   # Free space below which proxy repositories stop caching new content.
  #   minFreeSpace: 5%
  # Garbage collection deletes the blobs nothing references any more
  # (docs/garbage-collection.md). Administrators run it with flint gc;
  # interval also runs it on a schedule.
  # gc:
  #   # How long an unreferenced blob is kept after it was stored, and a blob
  #   # link no manifest references after it was linked or read, which bounds how long
  #   # a push may take between its blobs and its manifest; at least 1h.
  #   gracePeriod: 24h
  #   # Run garbage collection this long after the previous run started.
  #   interval: 24h
  # The audit log of every change (docs/operations.md) is kept forever by
  # default, on the data volume; retention bounds it by age, size, or both.
  # audit:
  #   retention:
  #     maxAge: 8760h
  #     maxSize: 10GiB

# Secrets holding proxy repositories' upstream passwords or access tokens.
# Each Secret's key "password" is mounted at
# /etc/flint/upstream/<name>/password, the path to give as
# config.repositories[].proxy.passwordFile. flint reads the file whenever it
# authenticates, so a rotated Secret takes effect without a restart.
upstreamSecrets: []
# - name: dockerhub
#   # Such as one made with
#   #   kubectl create secret generic dockerhub-credentials --from-literal=password=...
#   existingSecret: dockerhub-credentials

# The first administrator, which flint creates at startup while no
# administrator exists (docs/auth.md). Its password is the key "password" of
# an existing Secret, mounted at /etc/flint/admin; flint reads it only while no
# administrator exists, so the Secret may be deleted afterwards. Without
# it, flint starts with no administrator and logs a warning.
bootstrapAdmin:
  enabled: false
  username: admin
  # The Secret holding the password, such as one made with
  #   kubectl create secret generic flint-admin --from-literal=password=...
  existingSecret: ""

# A volume for backups (docs/backup.md), mounted at /var/backups/flint, which
# the chart sets as config.backup.directory. Start backups through the admin
# API, for example from a CronJob that runs flint backup.
backup:
  enabled: false
  # An existing PersistentVolumeClaim to back up to, ideally on other
  # storage than the data volume.
  existingClaim: ""
  # Or any other volume source, used when existingClaim is empty, such as
  #   nfs:
  #     server: nas.example.internal
  #     path: /backups/flint
  volume: {}

# The port flint listens on in the container.
containerPort: 5000

service:
  # ClusterIP, NodePort, or LoadBalancer.
  type: ClusterIP
  port: 5000
  # nodePort for type NodePort or LoadBalancer; empty lets Kubernetes choose.
  nodePort: null
  # loadBalancerIP requests a fixed address from load balancers that honor it.
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  # externalTrafficPolicy for NodePort and LoadBalancer: Cluster or Local.
  # Local keeps the client address, which flint logs.
  externalTrafficPolicy: ""
  annotations: {}
  labels: {}

tls:
  # Serve HTTPS from a certificate in a kubernetes.io/tls secret, mounted at
  # /etc/flint/tls. flint reloads it when the secret changes. Without TLS,
  # flint serves plain HTTP, for example behind a TLS-terminating proxy.
  enabled: false
  # An existing kubernetes.io/tls secret. Leave empty to have cert-manager
  # issue one with certManager below.
  existingSecret: ""
  certManager:
    # Create a cert-manager Certificate whose secret flint serves.
    enabled: false
    issuerRef:
      name: ""
      # ClusterIssuer or Issuer.
      kind: ClusterIssuer
      group: cert-manager.io
    # Names in the certificate. The service's cluster DNS names are added.
    dnsNames: []
    ipAddresses: []
    # duration and renewBefore, as Go durations; empty uses the issuer's.
    duration: ""
    renewBefore: ""
    privateKey:
      algorithm: ECDSA
      size: 256
      rotationPolicy: Always
    # secretName defaults to <fullname>-tls.
    secretName: ""

persistence:
  # Keep the data directory on a PersistentVolumeClaim. Disabled, the data
  # directory is an emptyDir and is lost with the pod.
  enabled: true
  # Use an existing claim instead of the StatefulSet's claim template.
  existingClaim: ""
  # storageClass for the claim; empty uses the cluster default, and "-"
  # requests no storage class.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

lifecycle:
  # Seconds the container waits before flint begins shutting down, so the
  # pod leaves Service endpoints before flint stops accepting connections.
  # 0 disables the wait.
  preStopSleepSeconds: 5

terminationGracePeriodSeconds: 40

probes:
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  # startup allows failureThreshold * periodSeconds for flint to replay its
  # metadata log before the liveness probe starts.
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 150

serviceAccount:
  create: true
  # name defaults to the fullname when create is true, and to "default" when
  # it is false.
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  # Create a NetworkPolicy that admits traffic only to flint's port.
  enabled: false
  # Peers allowed to reach flint, as NetworkPolicy "from" entries. Empty
  # admits every source.
  from: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: monitoring

resources: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   memory: 512Mi

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
