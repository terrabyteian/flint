{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flint.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# flint does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
