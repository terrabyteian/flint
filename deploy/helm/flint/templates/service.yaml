apiVersion: v1
kind: Service
metadata:
  name: {{ include "flint.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and (ne .Values.service.type "ClusterIP") .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "flint.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ ternary "https" "http" .Values.tls.enabled }}
      port: {{ .Values.service.port }}
      targetPort: {{ ternary "https" "http" .Values.tls.enabled }}
      protocol: TCP
      appProtocol: {{ ternary "https" "http" .Values.tls.enabled }}
      {{- if and (ne .Values.service.type "ClusterIP") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
