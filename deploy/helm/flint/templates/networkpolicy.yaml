{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flint.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flint.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ ternary "https" "http" .Values.tls.enabled }}
          protocol: TCP
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
