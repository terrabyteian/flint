# Example values for the flint Helm chart: HTTPS on a LoadBalancer address,
# with a certificate from cert-manager. See docs/helm.md. CI renders it and
# checks the configuration it produces with flint config check.
#
#   helm install flint oci://ghcr.io/terrabyteian/charts/flint \
#     --version 0.1.0 --namespace flint --create-namespace \
#     --values helm-values.example.yaml

config:
  log:
    level: info
  repositories:
    - name: docker-local
      format: oci
      type: hosted
    - name: releases
      format: oci
      type: hosted
      immutableTags: true
      anonymousPull: true
      # Also a classic Helm chart repository at /helm/releases/
      # (docs/helm-repository.md).
      helmIndex: true
    # A Docker Hub mirror, also usable as a containerd registry mirror
    # (docs/containerd.md).
    - name: dockerhub
      format: oci
      type: proxy
      anonymousPull: true
      proxy:
        url: https://registry-1.docker.io
  auth:
    permissions:
      - repositories: ["docker-local", "releases"]
        role: write
        groups: ["ci"]

# The first administrator's password, from a Secret created beforehand:
#   kubectl create secret generic flint-admin --namespace flint \
#     --from-literal=password="$(openssl rand -base64 24)"
bootstrapAdmin:
  enabled: true
  existingSecret: flint-admin

containerPort: 8443

service:
  type: LoadBalancer
  port: 443
  loadBalancerIP: 192.168.1.50
  # Keep client addresses, which flint logs, instead of the node's.
  externalTrafficPolicy: Local

tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      name: local-ca
      kind: ClusterIssuer
    dnsNames: ["registry.example.internal"]
    ipAddresses: ["192.168.1.50"]

persistence:
  size: 50Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi
