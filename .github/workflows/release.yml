# Publishes a flint release. See docs/releasing.md.
#
# Runs when a v* tag is pushed; recover from a failed run with "Re-run failed
# jobs". It publishes the multi-arch image to ghcr.io with a cosign signature and an
# SPDX SBOM attestation, and a GitHub release with static binaries, their
# checksums, a cosign bundle for the checksums, and the SBOM.
#
# Authentication is the workflow's GITHUB_TOKEN and its OIDC identity only;
# there are no stored secrets.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/terrabyteian/flint

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag is a version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag $REF_NAME is not a version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing of the checksums
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/flint-${target%/*}-${target#*/}" ./cmd/flint
          done
          cd dist
          sha256sum flint-* > SHA256SUMS
          cat SHA256SUMS
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  image:
    name: Image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing and attestation
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # The SBOM is generated and attested with cosign below instead.
          provenance: false
          sbom: false
          push: true
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom/flint-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign image and attest SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson \
            --predicate "sbom/flint-${VERSION}.spdx.json" "${IMAGE}@${DIGEST}"
          echo "Published ${IMAGE}:${VERSION} (${IMAGE}@${DIGEST})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # The Helm chart task adds a chart job here that pushes deploy/helm/flint to
  # oci://ghcr.io/terrabyteian/charts and signs it, and adds it to the release
  # job's needs.

  release:
    name: GitHub release
    needs: [version, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        run: |
          ls -l assets
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" assets/* --clobber
          else
            prerelease=
            case "$VERSION" in *-*) prerelease=--prerelease ;; esac
            gh release create "$VERSION" assets/* --verify-tag --generate-notes --title "$VERSION" $prerelease
          fi
