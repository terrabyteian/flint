# Publishes a flint release. See docs/releasing.md.
#
# Runs when a v* tag is pushed; recover from a failed run with "Re-run failed
# jobs". It publishes the multi-arch image to ghcr.io with a cosign signature and an
# SPDX SBOM attestation, the Helm chart to ghcr.io with a cosign signature, and
# a GitHub release with static binaries, their checksums, a cosign bundle for
# the checksums, the SBOM, and the chart package.
#
# Authentication is the workflow's GITHUB_TOKEN and its OIDC identity only;
# there are no stored secrets.
#
# Pull requests that touch the release inputs get a dry run: the same jobs build
# the binaries and image, generate the SBOM, package the chart, and check the
# release assets are all handed over, but nothing is pushed, signed, or
# released. Steps that publish are guarded by `github.event_name == 'push'`.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - deploy/helm/**

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/terrabyteian/flint
  CHARTS: ghcr.io/terrabyteian/charts

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag is a version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            REF_NAME="v0.0.0-pr.${PR_NUMBER}"
          fi
          if ! printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag $REF_NAME is not a version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing of the checksums
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/flint-${target%/*}-${target#*/}" ./cmd/flint
          done
          cd dist
          sha256sum flint-* > SHA256SUMS
          cat SHA256SUMS
      - name: Sign checksums
        if: github.event_name == 'push'
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  image:
    name: Image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing and attestation
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # The SBOM is generated and attested with cosign below instead.
          provenance: false
          sbom: false
          # A dry run writes the image to an OCI archive for the SBOM step.
          outputs: ${{ github.event_name == 'push' && 'type=image,push=true' || format('type=oci,dest={0}/flint.tar', runner.temp) }}
      # sbom-action does not create the output file's directory.
      - name: Create the SBOM directory
        run: mkdir sbom
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ github.event_name == 'push' && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || format('oci-archive:{0}/flint.tar', runner.temp) }}
          # A registry username makes sbom-action scan "registry:<image>",
          # so a dry run, which scans an archive, leaves it empty.
          registry-username: ${{ github.event_name == 'push' && github.actor || '' }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom/flint-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign image and attest SBOM
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson \
            --predicate "sbom/flint-${VERSION}.spdx.json" "${IMAGE}@${DIGEST}"
          echo "Published ${IMAGE}:${VERSION} (${IMAGE}@${DIGEST})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  chart:
    name: Helm chart
    # The chart deploys the image of the same release by default, so it is
    # published only once that image is.
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # For cosign; helm keeps its own registry login, below.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        # Chart versions are SemVer without the tag's "v"; appVersion keeps
        # it, since it is the image tag.
        run: |
          mkdir chart
          helm package deploy/helm/flint --version "${VERSION#v}" --app-version "$VERSION" --destination chart
      - name: Push and sign
        if: github.event_name == 'push'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "chart/flint-${VERSION#v}.tgz" "oci://${CHARTS}" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          cosign sign --yes "${CHARTS}/flint@${digest}"
          echo "Published ${CHARTS}/flint:${VERSION#v} (${CHARTS}/flint@${digest})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: chart/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, binaries, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Check the assets
        run: |
          ls -l assets
          expected="flint-linux-amd64 flint-linux-arm64 flint-darwin-amd64 flint-darwin-arm64
            SHA256SUMS flint-${VERSION}.spdx.json flint-${VERSION#v}.tgz"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            expected="$expected SHA256SUMS.sigstore.json"
          fi
          missing=0
          for name in $expected; do
            if [ ! -s "assets/$name" ]; then
              echo "::error::release asset $name is missing or empty"
              missing=1
            fi
          done
          exit "$missing"
      - name: Publish
        if: github.event_name == 'push'
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" assets/* --clobber
          else
            prerelease=
            case "$VERSION" in *-*) prerelease=--prerelease ;; esac
            gh release create "$VERSION" assets/* --verify-tag --generate-notes --title "$VERSION" $prerelease
          fi
