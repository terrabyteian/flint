name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Zero-dependency guard
        run: scripts/check-deps.sh
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test the sign-off check
        run: scripts/check-dco_test.sh
      - name: Check sign-off
        run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-X main.version=${GITHUB_SHA::12}" -o "flint-${GOOS}-${GOARCH}" ./cmd/flint

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      # CI-only tools: they never ship in flint, so the zero-dependency rule
      # does not apply.
      - name: Install kubeconform and yq
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          go install github.com/mikefarah/yq/v4@v4.47.2
      - name: Lint, render, and check
        run: scripts/check-chart.sh

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          push: false
      - name: Load linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          tags: flint:ci
          load: true
      - name: Smoke test
        run: |
          out=$(docker run --rm flint:ci version)
          echo "$out"
          test "$out" = "flint ${GITHUB_SHA}"

  oci:
    name: OCI conformance and real clients
    runs-on: ubuntu-latest
    env:
      # The official OCI distribution-spec conformance suite, v1.1.1.
      CONFORMANCE_REF: a139cc423184af6078077b9b7ee336eddbd03f8f
      CRANE_VERSION: v0.22.1
      ORAS_VERSION: v1.3.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start flint
        run: |
          # The e2e build moves its clock by the duration in
          # FLINT_E2E_CLOCK_FILE, for the garbage-collection test.
          CGO_ENABLED=0 go build -tags e2e -o "$RUNNER_TEMP/flint" ./cmd/flint
          admin_password=$(openssl rand -hex 16)
          echo "::add-mask::$admin_password"
          printf '%s\n' "$admin_password" >"$RUNNER_TEMP/admin-password"
          echo "ADMIN_PASSWORD=$admin_password" >>"$GITHUB_ENV"
          cat >"$RUNNER_TEMP/flint.json" <<JSON
          {
            "listen": "127.0.0.1:5000",
            "dataDir": "$RUNNER_TEMP/flint-data",
            "log": {"level": "debug"},
            "repositories": [
              {"name": "conformance", "format": "oci", "type": "hosted"},
              {"name": "e2e", "format": "oci", "type": "hosted"}
            ],
            "auth": {
              "bootstrapAdmin": {"passwordFile": "$RUNNER_TEMP/admin-password"},
              "permissions": [{"repositories": ["e2e"], "role": "delete", "groups": ["ci"]}]
            }
          }
          JSON
          FLINT_E2E_CLOCK_FILE="$RUNNER_TEMP/flint-clock" \
            "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >"$RUNNER_TEMP/flint.log" 2>&1 &
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
          # The registry asks anonymous clients to authenticate.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/v2/)" = 401
      - name: Create a CI user and API token
        run: |
          bot_password=$(openssl rand -hex 16)
          echo "::add-mask::$bot_password"
          curl -fsS -u "admin:$ADMIN_PASSWORD" http://127.0.0.1:5000/api/v1/users \
            -d "{\"name\": \"ci-bot\", \"password\": \"$bot_password\", \"groups\": [\"ci\"]}"
          token=$(curl -fsS -u "ci-bot:$bot_password" http://127.0.0.1:5000/api/v1/tokens \
            -d '{"name": "e2e", "expiresIn": "2h"}' | jq -r .token)
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >>"$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opencontainers/distribution-spec
          ref: ${{ env.CONFORMANCE_REF }}
          path: distribution-spec
          persist-credentials: false
      - name: Build the conformance suite
        working-directory: distribution-spec/conformance
        run: go test -c -o "$RUNNER_TEMP/conformance.test" .
      - name: Run the conformance suite
        env:
          OCI_ROOT_URL: http://127.0.0.1:5000
          OCI_USERNAME: admin
          OCI_NAMESPACE: conformance/myorg/myrepo
          OCI_CROSSMOUNT_NAMESPACE: conformance/myorg/other
          OCI_TEST_PULL: "1"
          OCI_TEST_PUSH: "1"
          OCI_TEST_CONTENT_DISCOVERY: "1"
          OCI_TEST_CONTENT_MANAGEMENT: "1"
          OCI_AUTOMATIC_CROSSMOUNT: "0"
          OCI_HIDE_SKIPPED_WORKFLOWS: "0"
        run: |
          export OCI_PASSWORD="$ADMIN_PASSWORD"
          mkdir -p "$RUNNER_TEMP/conformance"
          cd "$RUNNER_TEMP/conformance"
          OCI_REPORT_DIR="$PWD" "$RUNNER_TEMP/conformance.test"
      - name: Install crane and oras
        run: |
          go install "github.com/google/go-containerregistry/cmd/crane@$CRANE_VERSION"
          go install "oras.land/oras/cmd/oras@$ORAS_VERSION"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Push and pull with crane, oras, and docker
        env:
          E2E_USERNAME: ci-bot
        run: E2E_PASSWORD="$E2E_TOKEN" scripts/e2e-oci.sh 127.0.0.1:5000 e2e
      - name: Delete an image for garbage collection
        env:
          E2E_USERNAME: admin
          E2E_PASSWORD_FILE: ${{ runner.temp }}/admin-password
          E2E_STATE_DIR: ${{ runner.temp }}/e2e-gc
        run: scripts/e2e-gc.sh delete "$RUNNER_TEMP/flint" "$RUNNER_TEMP/flint-data" 127.0.0.1:5000 e2e
      - name: Move flint's clock three days ahead
        # Past the garbage collector's 24-hour grace period for everything
        # stored, linked, or read so far, and for the server's start.
        run: echo 72h >"$RUNNER_TEMP/flint-clock"
      - name: Garbage collection
        env:
          E2E_USERNAME: admin
          E2E_PASSWORD_FILE: ${{ runner.temp }}/admin-password
          E2E_STATE_DIR: ${{ runner.temp }}/e2e-gc
        run: scripts/e2e-gc.sh collect "$RUNNER_TEMP/flint" "$RUNNER_TEMP/flint-data" 127.0.0.1:5000 e2e
      - name: Show the flint log
        if: always()
        run: cat "$RUNNER_TEMP/flint.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oci-conformance-report
          path: ${{ runner.temp }}/conformance
          if-no-files-found: ignore

  helm:
    name: Helm repository with Helm ${{ matrix.helm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Helm 3 before 3.17 reads the JSON index as YAML; later releases
        # and Helm 4 detect JSON.
        helm: [v3.16.4, v3.22.0, v4.3.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - name: Start flint
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/flint" ./cmd/flint
          admin_password=$(openssl rand -hex 16)
          echo "::add-mask::$admin_password"
          printf '%s\n' "$admin_password" >"$RUNNER_TEMP/admin-password"
          echo "ADMIN_PASSWORD=$admin_password" >>"$GITHUB_ENV"
          cat >"$RUNNER_TEMP/flint.json" <<JSON
          {
            "listen": "127.0.0.1:5000",
            "dataDir": "$RUNNER_TEMP/flint-data",
            "log": {"level": "debug"},
            "repositories": [
              {"name": "charts", "format": "oci", "type": "hosted", "helmIndex": true}
            ],
            "auth": {
              "bootstrapAdmin": {"passwordFile": "$RUNNER_TEMP/admin-password"},
              "permissions": [{"repositories": ["charts"], "role": "write", "groups": ["ci"]}]
            }
          }
          JSON
          "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >"$RUNNER_TEMP/flint.log" 2>&1 &
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
      - name: Create a CI user and API token
        run: |
          bot_password=$(openssl rand -hex 16)
          echo "::add-mask::$bot_password"
          curl -fsS -u "admin:$ADMIN_PASSWORD" http://127.0.0.1:5000/api/v1/users \
            -d "{\"name\": \"ci-bot\", \"password\": \"$bot_password\", \"groups\": [\"ci\"]}"
          token=$(curl -fsS -u "ci-bot:$bot_password" http://127.0.0.1:5000/api/v1/tokens \
            -d '{"name": "e2e", "expiresIn": "2h"}' | jq -r .token)
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >>"$GITHUB_ENV"
      - name: Push with helm push and install from the classic repository
        env:
          E2E_USERNAME: ci-bot
        run: E2E_PASSWORD="$E2E_TOKEN" scripts/e2e-helm.sh 127.0.0.1:5000 charts
      - name: Show the flint log
        if: always()
        run: cat "$RUNNER_TEMP/flint.log"

  proxy:
    name: Proxy end to end
    runs-on: ubuntu-latest
    env:
      CRANE_VERSION: v0.22.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install crane
        run: |
          go install "github.com/google/go-containerregistry/cmd/crane@$CRANE_VERSION"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Start flint
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/flint" ./cmd/flint
          cat >"$RUNNER_TEMP/flint.json" <<JSON
          {
            "listen": "127.0.0.1:5000",
            "dataDir": "$RUNNER_TEMP/flint-data",
            "log": {"level": "debug"},
            "repositories": [
              {"name": "dockerhub", "format": "oci", "type": "proxy", "anonymousPull": true,
               "proxy": {"url": "https://registry-1.docker.io", "revalidateAfter": "1s"}},
              {"name": "ghcr", "format": "oci", "type": "proxy", "anonymousPull": true,
               "proxy": {"url": "https://ghcr.io", "revalidateAfter": "1s"}}
            ]
          }
          JSON
          "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >"$RUNNER_TEMP/flint.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/flint.pid"
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
      - name: Pull through the proxies with crane, docker, and containerd
        run: E2E_STATE_DIR="$RUNNER_TEMP/e2e-proxy" scripts/e2e-proxy.sh online 127.0.0.1:5000 dockerhub ghcr
      - name: Restart flint with its upstreams unreachable
        run: |
          pid=$(cat "$RUNNER_TEMP/flint.pid")
          kill "$pid"
          while kill -0 "$pid" 2>/dev/null; do sleep 0.2; done
          # Every upstream request now goes to a proxy that refuses connections.
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= \
            "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >>"$RUNNER_TEMP/flint.log" 2>&1 &
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
      - name: Pull again from the cache
        run: E2E_STATE_DIR="$RUNNER_TEMP/e2e-proxy" scripts/e2e-proxy.sh offline 127.0.0.1:5000 dockerhub ghcr
      - name: Show the flint log
        if: always()
        run: cat "$RUNNER_TEMP/flint.log"

  pypi:
    name: PyPI end to end
    runs-on: ubuntu-latest
    env:
      PIP_VERSION: "26.2.1"
      TWINE_VERSION: "7.0.0"
      UV_VERSION: "0.12.17"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # CI-only tools: they never ship in flint, so the zero-dependency rule
      # does not apply.
      - name: Install pip, twine, and uv
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet "pip==$PIP_VERSION" "twine==$TWINE_VERSION" "uv==$UV_VERSION"
          echo "$RUNNER_TEMP/tools/bin" >>"$GITHUB_PATH"
      - name: Start flint
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/flint" ./cmd/flint
          admin_password=$(openssl rand -hex 16)
          echo "::add-mask::$admin_password"
          printf '%s\n' "$admin_password" >"$RUNNER_TEMP/admin-password"
          echo "ADMIN_PASSWORD=$admin_password" >>"$GITHUB_ENV"
          cat >"$RUNNER_TEMP/flint.json" <<JSON
          {
            "listen": "127.0.0.1:5000",
            "dataDir": "$RUNNER_TEMP/flint-data",
            "log": {"level": "debug"},
            "repositories": [
              {"name": "pypi-local", "format": "pypi", "type": "hosted"},
              {"name": "pypi", "format": "pypi", "type": "proxy", "anonymousPull": true,
               "proxy": {"url": "https://pypi.org/simple/", "revalidateAfter": "1s"}},
              {"name": "pypi-all", "format": "pypi", "type": "virtual", "anonymousPull": true,
               "virtual": {"members": ["pypi-local", "pypi"]}}
            ],
            "auth": {
              "bootstrapAdmin": {"passwordFile": "$RUNNER_TEMP/admin-password"},
              "permissions": [{"repositories": ["pypi-local"], "role": "write", "groups": ["ci"]}]
            }
          }
          JSON
          "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >"$RUNNER_TEMP/flint.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/flint.pid"
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
      - name: Create a CI user and API token
        run: |
          bot_password=$(openssl rand -hex 16)
          echo "::add-mask::$bot_password"
          curl -fsS -u "admin:$ADMIN_PASSWORD" http://127.0.0.1:5000/api/v1/users \
            -d "{\"name\": \"ci-bot\", \"password\": \"$bot_password\", \"groups\": [\"ci\"]}"
          token=$(curl -fsS -u "ci-bot:$bot_password" http://127.0.0.1:5000/api/v1/tokens \
            -d '{"name": "e2e", "expiresIn": "2h"}' | jq -r .token)
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >>"$GITHUB_ENV"
      - name: Publish with twine and uv, install with pip and uv
        run: |
          E2E_STATE_DIR="$RUNNER_TEMP/e2e-pypi" E2E_ADMIN="admin:$ADMIN_PASSWORD" \
            scripts/e2e-pypi.sh online 127.0.0.1:5000 pypi-local pypi pypi-all
      - name: Restart flint with its upstream unreachable
        run: |
          pid=$(cat "$RUNNER_TEMP/flint.pid")
          kill "$pid"
          while kill -0 "$pid" 2>/dev/null; do sleep 0.2; done
          # Every upstream request now goes to a proxy that refuses connections.
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= \
            "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >>"$RUNNER_TEMP/flint.log" 2>&1 &
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
      - name: Install again from the cache
        run: |
          E2E_STATE_DIR="$RUNNER_TEMP/e2e-pypi" E2E_ADMIN="admin:$ADMIN_PASSWORD" \
            scripts/e2e-pypi.sh offline 127.0.0.1:5000 pypi-local pypi pypi-all
      - name: Show the flint log
        if: always()
        run: cat "$RUNNER_TEMP/flint.log"

  generic:
    name: Generic files end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start flint
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/flint" ./cmd/flint
          admin_password=$(openssl rand -hex 16)
          echo "::add-mask::$admin_password"
          printf '%s\n' "$admin_password" >"$RUNNER_TEMP/admin-password"
          echo "ADMIN_PASSWORD=$admin_password" >>"$GITHUB_ENV"
          # GitHub redirects release downloads to another host, which the
          # proxies must be allowed to fetch from.
          cat >"$RUNNER_TEMP/flint.json" <<JSON
          {
            "listen": "127.0.0.1:5000",
            "dataDir": "$RUNNER_TEMP/flint-data",
            "log": {"level": "debug"},
            "repositories": [
              {"name": "generic-local", "format": "generic", "type": "hosted"},
              {"name": "generic-scratch", "format": "generic", "type": "hosted", "generic": {"allowOverwrite": true}},
              {"name": "flint-releases", "format": "generic", "type": "proxy", "anonymousPull": true,
               "generic": {"immutable": true},
               "proxy": {"url": "https://github.com/terrabyteian/flint/releases/download/",
                         "allowHosts": ["release-assets.githubusercontent.com", "objects.githubusercontent.com"]}},
              {"name": "flint-releases-revalidated", "format": "generic", "type": "proxy", "anonymousPull": true,
               "proxy": {"url": "https://github.com/terrabyteian/flint/releases/download/", "revalidateAfter": "1s",
                         "allowHosts": ["release-assets.githubusercontent.com", "objects.githubusercontent.com"]}},
              {"name": "generic-all", "format": "generic", "type": "virtual",
               "virtual": {"publishTo": "generic-local", "members": ["generic-local", "flint-releases"]}}
            ],
            "auth": {
              "bootstrapAdmin": {"passwordFile": "$RUNNER_TEMP/admin-password"},
              "permissions": [
                {"repositories": ["generic-local", "generic-scratch"], "role": "delete", "groups": ["ci"]},
                {"repositories": ["generic-all"], "role": "read", "groups": ["ci"]}
              ]
            }
          }
          JSON
          "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >"$RUNNER_TEMP/flint.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/flint.pid"
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
          # curl and wget get a Basic challenge.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/generic/generic-local/)" = 401
      - name: Create a CI user and API token
        run: |
          bot_password=$(openssl rand -hex 16)
          echo "::add-mask::$bot_password"
          curl -fsS -u "admin:$ADMIN_PASSWORD" http://127.0.0.1:5000/api/v1/users \
            -d "{\"name\": \"ci-bot\", \"password\": \"$bot_password\", \"groups\": [\"ci\"]}"
          token=$(curl -fsS -u "ci-bot:$bot_password" http://127.0.0.1:5000/api/v1/tokens \
            -d '{"name": "e2e", "expiresIn": "2h"}' | jq -r .token)
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >>"$GITHUB_ENV"
      - name: Upload, download, and list with curl and wget
        env:
          E2E_USERNAME: ci-bot
        run: |
          E2E_STATE_DIR="$RUNNER_TEMP/e2e-generic" scripts/e2e-generic.sh online 127.0.0.1:5000 \
            generic-local generic-scratch flint-releases flint-releases-revalidated generic-all
      - name: Restart flint with its upstreams unreachable
        run: |
          pid=$(cat "$RUNNER_TEMP/flint.pid")
          kill "$pid"
          while kill -0 "$pid" 2>/dev/null; do sleep 0.2; done
          # Every upstream request now goes to a proxy that refuses connections.
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= \
            "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >>"$RUNNER_TEMP/flint.log" 2>&1 &
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
      - name: Download again from the cache
        env:
          E2E_USERNAME: ci-bot
        run: |
          E2E_STATE_DIR="$RUNNER_TEMP/e2e-generic" scripts/e2e-generic.sh offline 127.0.0.1:5000 \
            generic-local generic-scratch flint-releases flint-releases-revalidated generic-all
      - name: Show the flint log
        if: always()
        run: cat "$RUNNER_TEMP/flint.log"

  cargo:
    name: Cargo end to end
    runs-on: ubuntu-latest
    env:
      RUST_VERSION: "1.97.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # CI-only tools: they never ship in flint, so the zero-dependency rule
      # does not apply. The runner image has rustup.
      - name: Install Cargo
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >>"$GITHUB_ENV"
      - name: Start flint
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/flint" ./cmd/flint
          admin_password=$(openssl rand -hex 16)
          echo "::add-mask::$admin_password"
          printf '%s\n' "$admin_password" >"$RUNNER_TEMP/admin-password"
          echo "ADMIN_PASSWORD=$admin_password" >>"$GITHUB_ENV"
          cat >"$RUNNER_TEMP/flint.json" <<JSON
          {
            "listen": "127.0.0.1:5000",
            "dataDir": "$RUNNER_TEMP/flint-data",
            "log": {"level": "debug"},
            "repositories": [
              {"name": "cargo-local", "format": "cargo", "type": "hosted"},
              {"name": "crates-io", "format": "cargo", "type": "proxy", "anonymousPull": true,
               "proxy": {"url": "sparse+https://index.crates.io/", "revalidateAfter": "1s"}},
              {"name": "cargo-all", "format": "cargo", "type": "virtual",
               "virtual": {"members": ["cargo-local", "crates-io"], "publishTo": "cargo-local"}}
            ],
            "auth": {
              "bootstrapAdmin": {"passwordFile": "$RUNNER_TEMP/admin-password"},
              "permissions": [
                {"repositories": ["cargo-local"], "role": "write", "groups": ["ci"]},
                {"repositories": ["cargo-all"], "role": "read", "groups": ["ci"]}
              ]
            }
          }
          JSON
          "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >"$RUNNER_TEMP/flint.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/flint.pid"
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
      - name: Create a CI user and API token
        run: |
          bot_password=$(openssl rand -hex 16)
          echo "::add-mask::$bot_password"
          curl -fsS -u "admin:$ADMIN_PASSWORD" http://127.0.0.1:5000/api/v1/users \
            -d "{\"name\": \"ci-bot\", \"password\": \"$bot_password\", \"groups\": [\"ci\"]}"
          token=$(curl -fsS -u "ci-bot:$bot_password" http://127.0.0.1:5000/api/v1/tokens \
            -d '{"name": "e2e", "expiresIn": "2h"}' | jq -r .token)
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >>"$GITHUB_ENV"
      - name: Publish, yank, and build with cargo
        run: |
          E2E_STATE_DIR="$RUNNER_TEMP/e2e-cargo" E2E_ADMIN="admin:$ADMIN_PASSWORD" \
            scripts/e2e-cargo.sh online 127.0.0.1:5000 cargo-local crates-io cargo-all
      - name: Restart flint with its upstream unreachable
        run: |
          pid=$(cat "$RUNNER_TEMP/flint.pid")
          kill "$pid"
          while kill -0 "$pid" 2>/dev/null; do sleep 0.2; done
          # Every upstream request now goes to a proxy that refuses connections.
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= \
            "$RUNNER_TEMP/flint" serve -config "$RUNNER_TEMP/flint.json" >>"$RUNNER_TEMP/flint.log" 2>&1 &
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:5000/readyz && break
            sleep 0.2
          done
      - name: Build again from the cache
        run: |
          E2E_STATE_DIR="$RUNNER_TEMP/e2e-cargo" E2E_ADMIN="admin:$ADMIN_PASSWORD" \
            scripts/e2e-cargo.sh offline 127.0.0.1:5000 cargo-local crates-io cargo-all
      - name: Show the flint log
        if: always()
        run: cat "$RUNNER_TEMP/flint.log"
